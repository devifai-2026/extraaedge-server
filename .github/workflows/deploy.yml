name: Deploy to Hostinger

# Every push to main ships. The box is LiteSpeed Passenger on Hostinger shared
# hosting, NOT the systemd setup described in ops/systemd/ — see DEPLOY.md.
#
# Two directories matter and confusing them is the classic failure here:
#   ~/domains/admissioncrm.live/nodejs                 the git checkout
#   ~/domains/.builds/current/nodejs                   what Passenger runs
# So the job pulls into the checkout, syncs src/ into the live build, and
# touches the build's own tmp/restart.txt (the configured PassengerRestartDir).
on:
  push:
    branches: [main]
  workflow_dispatch:        # manual re-deploy from the Actions tab

concurrency:
  # Never let two deploys interleave their rsync + restart.
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key so a MITM can't collect the deploy key.
          printf '%s\n' "${{ secrets.HOSTINGER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SHA: ${{ github.sha }}
        run: |
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "SHA=$SHA bash -l -s" <<'REMOTE'
          set -euo pipefail

          D="$HOME/domains/admissioncrm.live"
          SRC="$D/nodejs"
          LIVE="$D/.builds/current/nodejs"

          [ -d "$SRC/.git" ] || { echo "::error::git checkout missing at $SRC"; exit 1; }
          [ -d "$LIVE/src" ] || { echo "::error::live build missing at $LIVE"; exit 1; }

          # Hostinger's Node is off the default non-interactive PATH.
          ALT_NODE=/opt/alt/alt-nodejs20/root/usr/bin
          [ -d "$ALT_NODE" ] && export PATH="$ALT_NODE:$PATH"

          cd "$SRC"
          echo "== before: $(git log -1 --format='%h %s')"
          git fetch --quiet origin main
          git pull --ff-only origin main
          echo "== after:  $(git log -1 --format='%h %s')"

          # Fail loudly if the box didn't land on the commit that triggered
          # this run — a silent old-code deploy is the thing we're preventing.
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "$LOCAL_SHA" != "$SHA" ]; then
            echo "::warning::server is on $LOCAL_SHA but this run is for $SHA"
          fi

          # Only reinstall when the dependency set actually changed; npm ci on
          # every push costs minutes on shared hosting for no benefit.
          if ! diff -q package.json "$LIVE/package.json" >/dev/null 2>&1; then
            echo "== package.json changed, installing"
            npm install --omit=dev --no-audit --no-fund
            cp package.json package-lock.json "$LIVE/" 2>/dev/null || true
            rsync -a node_modules/ "$LIVE/node_modules/"
          else
            echo "== dependencies unchanged"
          fi

          # src/ only: keeps the build's own .env and node_modules untouched.
          rsync -a --delete "$SRC/src/" "$LIVE/src/"
          echo "== synced src/ into the live build"

          mkdir -p "$LIVE/tmp"
          touch "$LIVE/tmp/restart.txt"
          echo "== restart requested"
          REMOTE

      - name: Wait for the new process to serve
        run: |
          # healthz alone is not enough: it can be answered by the OLD worker
          # that is still up while Passenger respawns, and then the first real
          # request lands mid-restart and 503s. Poll a route instead, and treat
          # 5xx/000 as "still warming".
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://admissioncrm.live/api/v1/qa-reviews/parameters || echo 000)
            case "$code" in
              5*|000) sleep 5 ;;
              *) echo "serving after ${i} attempt(s) (status $code)"; exit 0 ;;
            esac
          done
          echo "::error::app never stopped returning 5xx within 150s"
          exit 1

      - name: Smoke-test the API
        run: |
          fail=0

          # A mounted route answers 401 (auth required); an unmounted one 404s.
          # This is the check that distinguishes new code from old — /users/*
          # and /platform/* 401 either way because their routers mount
          # authRequired ahead of routing.
          #
          # Retries on 5xx only: a wrong-but-stable status (404) fails fast,
          # while a cold worker gets a moment to warm up.
          check() {
            local method="$1" path="$2" want="$3" code=
            for _ in 1 2 3 4 5; do
              if [ "$method" = POST ]; then
                code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                  -H 'Content-Type: application/json' -d '{}' "https://admissioncrm.live$path" || echo 000)
              else
                code=$(curl -s -o /dev/null -w '%{http_code}' "https://admissioncrm.live$path" || echo 000)
              fi
              case "$code" in 5*|000) sleep 5 ;; *) break ;; esac
            done
            echo "$method $path -> $code"
            [ "$code" = "$want" ] || { echo "::error::$path returned $code, expected $want"; fail=1; }
          }

          check GET  /api/v1/qa-reviews/parameters 401
          check GET  /api/v1/qa-reviews/queue 401
          check POST /api/v1/platform/impersonate/tenant-admin 401
          # Passwordless login config must be readable without a session.
          check GET  '/api/v1/auth/login-methods?tenant_slug=demo' 200

          exit $fail
